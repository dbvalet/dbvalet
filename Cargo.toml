[package]
name = "dbvalet"
version = "0.0.0"
edition = "2024"
# Fixed at the stable release on launch day; raised only in a minor release.
rust-version = "1.98"
license = "Apache-2.0"
description = "Run an AI coding agent with a temporary PostgreSQL login it never sees."
repository = "https://github.com/dbvalet/dbvalet"
homepage = "https://github.com/dbvalet/dbvalet"
publish = false

# Releases ship as binaries and a Homebrew formula, so dist must build this
# package even though `publish = false` keeps it off crates.io.
[package.metadata.dist]
dist = true

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.10", features = ["derive"] }
keyring-core = "1.1.0"
rpassword = "7.5.5"
secrecy = "0.10.3"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "macros"] }
tokio-postgres = { version = "0.7.18", default-features = false, features = ["runtime"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.3", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
