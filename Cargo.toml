[package]
name = "dbvalet"
version = "0.0.0"
edition = "2024"
# Fixed at the stable release on launch day; raised only in a minor release.
rust-version = "1.98"
license = "Apache-2.0"
description = "Run an AI coding agent with a temporary PostgreSQL login it never sees."
repository = "https://github.com/dbvalet/dbvalet"
homepage = "https://github.com/dbvalet/dbvalet"
publish = false

# Releases ship as binaries and a Homebrew formula, so dist must build this
# package even though `publish = false` keeps it off crates.io.
[package.metadata.dist]
dist = true

[dependencies]
anyhow = "1.0.105"
bytes = "1.12.2"
clap = { version = "4.6.10", features = ["derive"] }
fallible-iterator = "0.2.0"
getrandom = "0.4.3"
keyring-core = "1.1.0"
percent-encoding = "2.3.2"
postgres-protocol = "0.6.12"
rpassword = "7.5.5"
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
rustls-platform-verifier = "0.7.1"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = { version = "0.11", default-features = false }
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "macros", "net", "io-util", "process", "sync", "time"] }
tokio-postgres = { version = "0.7.18", default-features = false, features = ["runtime"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs"] }
tokio-util = { version = "0.7.20", default-features = false }
toml = { version = "1.2.3", default-features = false, features = ["parse", "serde", "std"] }
x509-cert = { version = "0.2", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.3", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
