name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 1.98 is the minimum supported Rust version in Cargo.toml.
        toolchain: [stable, "1.98"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the D-Bus headers the Secret Service store links against
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - name: Install Rust ${{ matrix.toolchain }}
        run: |
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component rustfmt,clippy
          rustup default ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: A release build ignores the test-only lease minute
        run: cargo test --locked --release --lib a_release_build -- --ignored
        env:
          DBVALET_TEST_MINUTE_MS: "1"
      - name: Only the debug binary contains the test keychain switch
        run: |
          cargo build --locked --bin dbvalet
          cargo build --locked --release --bin dbvalet
          # The debug match proves the needle is still the switch's name.
          grep -aq DBVALET_TEST_KEYCHAIN target/debug/dbvalet
          # Exit 1 is "no match"; 2 (a missing binary) must fail too.
          status=0; grep -aq DBVALET_TEST_KEYCHAIN target/release/dbvalet || status=$?
          test "$status" -eq 1

  e2e:
    name: e2e (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        postgres: ["15", "16", "17", "18", "19"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          # Throwaway superuser password for this job's database; tests/e2e.rs uses it too.
          POSTGRES_PASSWORD: e2e-throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install gnome-keyring, the D-Bus headers and PostgreSQL ${{ matrix.postgres }} psql
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-keyring dbus libdbus-1-dev pkg-config postgresql-common ca-certificates
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-${{ matrix.postgres }}
          echo "/usr/lib/postgresql/${{ matrix.postgres }}/bin" >> "$GITHUB_PATH"
      - name: Check that psql matches PostgreSQL ${{ matrix.postgres }}
        run: |
          version=$(psql --version)
          echo "$version"
          case "$version" in
            "psql (PostgreSQL) ${{ matrix.postgres }}."*) ;;
            *) echo "expected psql ${{ matrix.postgres }}.x, got: $version" >&2; exit 1 ;;
          esac
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Run the e2e tests against the real Secret Service
        env:
          POSTGRES_MAJOR: ${{ matrix.postgres }}
        # The keyring password is a throwaway for this runner's empty login keyring.
        run: >-
          dbus-run-session -- sh -c
          'printf e2e-throwaway | gnome-keyring-daemon --unlock --components=secrets >/dev/null
          && cargo test --locked --test e2e -- --ignored
          && bash tests/run-tls-e2e.sh "$POSTGRES_MAJOR"'

  e2e-pg14:
    name: e2e (PostgreSQL 14 refusal)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:14
        env:
          # Throwaway superuser password for this job's database; tests/e2e_pg14.rs uses it too.
          POSTGRES_PASSWORD: e2e-throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install gnome-keyring and the D-Bus headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gnome-keyring dbus libdbus-1-dev pkg-config
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Run the PostgreSQL 14 refusal e2e tests against the real Secret Service
        # The keyring password is a throwaway for this runner's empty login keyring.
        run: >-
          dbus-run-session -- sh -c
          'printf e2e-throwaway | gnome-keyring-daemon --unlock --components=secrets >/dev/null
          && cargo test --locked --test e2e_pg14 -- --ignored'

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  commit-subjects:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Subjects are 72 characters or fewer
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          long=$(git log --format=%s "$BASE..$HEAD" | awk 'length > 72')
          if [ -n "$long" ]; then
            echo "These commit subjects are over 72 characters:"
            echo "$long"
            exit 1
          fi
