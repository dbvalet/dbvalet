name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.98 is the minimum supported Rust version in Cargo.toml.
        toolchain: [stable, "1.98"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the D-Bus headers the Secret Service store links against
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - name: Install Rust ${{ matrix.toolchain }}
        run: |
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component rustfmt,clippy
          rustup default ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  e2e:
    name: e2e (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["14", "16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          # Throwaway superuser password for this job's database; tests/e2e.rs uses it too.
          POSTGRES_PASSWORD: e2e-throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install gnome-keyring and the D-Bus headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gnome-keyring dbus libdbus-1-dev pkg-config
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Run the e2e tests against the real Secret Service
        # The keyring password is a throwaway for this runner's empty login keyring.
        run: >-
          dbus-run-session -- sh -c
          'printf e2e-throwaway | gnome-keyring-daemon --unlock --components=secrets >/dev/null
          && cargo test --locked --test e2e -- --ignored'

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  commit-subjects:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Subjects are 72 characters or fewer
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          long=$(git log --format=%s "$BASE..$HEAD" | awk 'length > 72')
          if [ -n "$long" ]; then
            echo "These commit subjects are over 72 characters:"
            echo "$long"
            exit 1
          fi
